<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>妙麗歲數計算機</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <img class="avatar" src="https://hackmd.io/_uploads/r10xgVflZe.png" alt="妙麗頭像" />

    <h1>🐶 妙麗歲數計算機</h1>

    <label for="birthday">妙麗的生日：</label>
    <input type="date" id="birthday" />

    <button id="calcBtn">開始計算</button>

    <div class="info-box">
      💡 輸入日期後按下按鈕即可計算。
    </div>

    <!-- ⭐ 結果區塊預設隱藏，但保留位置 -->
    <div id="result" class="result-box hidden"></div>
  </div>

  <script src="app.js"></script>
</body>


</html>
